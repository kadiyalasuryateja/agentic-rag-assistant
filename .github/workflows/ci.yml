name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests eval
      - name: Tests (core install, built-in vector store)
        run: pytest -q
      - run: pip install -e ".[chroma]"
      - name: Tests (with Chroma)
        run: pytest -q
      - name: Offline evaluation
        run: python eval/run_eval.py --docs data/docs

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentic-rag-assistant .
